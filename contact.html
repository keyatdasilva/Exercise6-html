<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Header section -->
    <header>
      <h1>Contact Us</h1>
      <p>Send us a message or pick an appointment time below.</p>
    </header>

    <!-- Contact form section -->
    <section class="card">
      <h2>Send a Message</h2>

      <form action="#" method="post">

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="082 123 4567">
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            <option value="general">General enquiry</option>
            <option value="appointment">Book an appointment</option>
            <option value="support">Support</option>
            <option value="feedback">Feedback</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Type your message here..."></textarea>
        </div>

        <button type="submit">Send Message</button>

      </form>
    </section>

    <!-- Schedule table section -->
    <section class="card">
      <h2>Available Appointment Times</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Monday</td>
              <td>09:00</td>
              <td>Available</td>
            </tr>
            <tr>
              <td>Monday</td>
              <td>11:00</td>
              <td>Booked</td>
            </tr>
            <tr>
              <td>Tuesday</td>
              <td>10:00</td>
              <td>Available</td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td>14:00</td>
              <td>Available</td>
            </tr>
            <tr>
              <td>Thursday</td>
              <td>09:30</td>
              <td>Booked</td>
            </tr>
            <tr>
              <td>Friday</td>
              <td>13:00</td>
              <td>Available</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

</body>
</html>
